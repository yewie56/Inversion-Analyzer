name: Inversion data collector

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Ausfuehrungsmodus: normal, scheduled oder kit-only"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - scheduled
          - kit-only
      date:
        description: "Optionales Datum JJJJ-MM-TT; leer = heute"
        required: false
        type: string
      force:
        description: "Alle Quellen neu abrufen"
        required: false
        default: false
        type: boolean
      location:
        description: "Ortsschlüssel aus locations.json oder ALL"
        required: false
        default: "Viernheim"
        type: string
  schedule:
    # v0.15.21: zweimal pro Stunde; workflow_dispatch kann denselben scheduled-Pfad explizit starten.
    # KIT stellt nur ein kurzes rollierendes Profilfenster bereit. 30 Minuten
    # verringern das Verlustrisiko bei einzelnen ausgefallenen Läufen deutlich.
    # Der Python-Server entscheidet weiterhin pro Ort, welche Quellen fällig sind.
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: inversion-data-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests pandas numpy matplotlib bokeh

      - name: Restore radiosonde cache
        uses: actions/cache@v6
        with:
          path: cache/radiosonde_highres
          # A stable base key plus restore prefix lets a cache produced by an
          # earlier run be reused, while GitHub can save updated contents.
          key: radiosonde-highres-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            radiosonde-highres-${{ runner.os }}-

      - name: Resolve locations
        id: locations
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ALL_LOCATIONS < <(
            python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("locations.json").read_text(encoding="utf-8"))
          for key in data.get("locations",{}):
              print(key)
          PY
          )

          if [ "${#ALL_LOCATIONS[@]}" -eq 0 ]; then
            echo "FEHLER: locations.json enthält keine Orte."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "schedule" ]; then
            SELECTED=("${ALL_LOCATIONS[@]}")
          else
            REQUESTED="${{ inputs.location }}"
            if [ -z "$REQUESTED" ]; then REQUESTED="Viernheim"; fi

            if [ "$REQUESTED" = "ALL" ]; then
              SELECTED=("${ALL_LOCATIONS[@]}")
            else
              FOUND=false
              for LOC in "${ALL_LOCATIONS[@]}"; do
                if [ "$LOC" = "$REQUESTED" ]; then FOUND=true; fi
              done
              if [ "$FOUND" != "true" ]; then
                echo "FEHLER: Ort '$REQUESTED' ist nicht in locations.json."
                printf 'Verfügbar: %s\n' "${ALL_LOCATIONS[*]}"
                exit 1
              fi
              SELECTED=("$REQUESTED")
            fi
          fi

          printf '%s\n' "${SELECTED[@]}" > .selected_locations.txt
          echo "Ausgewählte Orte:"
          cat .selected_locations.txt

      - name: Preflight selftest
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r LOC; do
            echo "============================================================"
            echo "SELFTEST: $LOC"
            echo "============================================================"
            INVERSION_LOCATION="$LOC" python Inversion_Server.py --selftest
            INVERSION_LOCATION="$LOC" python Inversion_Server.py --show-config
            INVERSION_LOCATION="$LOC" python Inversion_Server.py --verify-archive
          done < .selected_locations.txt

      - name: Scheduled collection
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r LOC; do
            echo "============================================================"
            echo "SCHEDULED COLLECTION: $LOC"
            echo "============================================================"
            INVERSION_LOCATION="$LOC" python Inversion_Server.py --scheduled
          done < .selected_locations.txt

      - name: Manual collection
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="normal"; fi

          while IFS= read -r LOC; do
            echo "============================================================"

            case "$MODE" in
              scheduled)
                echo "MANUAL SCHEDULED COLLECTION: $LOC"
                echo "============================================================"
                INVERSION_LOCATION="$LOC" python Inversion_Server.py --scheduled
                ;;

              kit-only)
                echo "MANUAL KIT-ONLY COLLECTION: $LOC"
                echo "============================================================"
                INVERSION_LOCATION="$LOC" python Inversion_Server.py --kit-only
                ;;

              normal)
                echo "MANUAL NORMAL COLLECTION: $LOC"
                echo "============================================================"
                ARGS=()
                if [ -n "${{ inputs.date }}" ]; then
                  ARGS+=(--date "${{ inputs.date }}")
                else
                  ARGS+=(--today)
                fi
                if [ "${{ inputs.force }}" = "true" ]; then
                  ARGS+=(--force)
                fi
                INVERSION_LOCATION="$LOC" python Inversion_Server.py "${ARGS[@]}"
                ;;

              *)
                echo "FEHLER: unbekannter mode '$MODE'. Erlaubt: normal, scheduled, kit-only."
                exit 2
                ;;
            esac

            INVERSION_LOCATION="$LOC" python Inversion_Server.py --verify-archive
          done < .selected_locations.txt

      - name: Show archive changes
        shell: bash
        run: |
          set -euo pipefail
          echo "============================================================"
          echo "ARCHIVE CHANGES"
          echo "============================================================"
          git status --short archive || true
          echo
          git diff --stat -- archive || true
          echo
          git diff --name-status -- archive || true

      - name: Commit archive changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "inversion-collector"
          git config user.email "actions@users.noreply.github.com"

          git add archive

          if git diff --cached --quiet; then
            echo "Keine Archivänderungen – kein Commit."
            exit 0
          fi

          echo "Folgende Archivdateien werden committed:"
          git diff --cached --name-status

          LOCS="$(paste -sd, .selected_locations.txt)"
          git commit -m "Update inversion archive: ${LOCS}"
          git push
